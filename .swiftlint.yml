# .swiftlint.yml — Lumina SwiftLint Config
# Strict mode — zero warnings policy (CI enforces --strict)

# ── Included / Excluded paths ──
included:
  - Lumina
  - LuminaTests
  # The widget extension was outside the lint scope entirely, which is how it
  # accumulated three hand-copied `Color(red:green:blue:)` brand colours. It
  # ships in the same binary; it gets the same rules. (`no_raw_rgb_colors`
  # below now catches that specific case — the palette-token rules only ever
  # covered `Color(hex:)`.)
  - LuminaWidget

excluded:
  - Lumina/Resources
  - .build
  - DerivedData
  - Packages

# ── Opt-in rules (not enabled by default) ──
#
# NOTE: The following opt-in rules were intentionally NOT adopted because they
# fight this codebase's consistent, deliberate house style and would require
# mass-rewriting idiomatic code with no quality gain:
#   - switch_case_on_newline   — we use single-line value-returning switch
#                                expressions (`case .today: "Today"`) throughout
#   - multiline_arguments / multiline_parameters — call-site formatting is left
#                                to swiftformat, not lint-enforced
#   - number_separator         — fussy on years / timestamps in fixtures
#   - type_contents_order      — high-friction in a no-Mac workflow (see
#                                LEARNINGS.md); member ordering is a review item
#   - trailing_closure         — we sometimes pass closures as named args
#                                (e.g. LuminaEmptyState.CTA(action:)) on purpose
#   - closure_body_length / legacy_multiple — low value here
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - colon
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - expiring_todo
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - multiline_function_chains
  - multiline_literal_brackets
  - nimble_operator
  - no_extension_access_modifier
  - object_literal
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - xct_specific_matcher
  - yoda_condition

# ── Disabled rules ──
disabled_rules:
  - todo              # we use // TODO(lumina): format — checked separately
  - trailing_whitespace  # formatter handles this
  - trailing_comma    # we keep trailing commas in multiline literals (cleaner diffs)
  - large_tuple       # small ad-hoc return tuples are fine; not worth a struct each

# ── Rule configurations ──
line_length:
  # Lenient enough for inline user-facing copy strings (FAQ bodies, etc.);
  # logic lines all sit well under this. Genuinely egregious lines are wrapped.
  warning: 200
  error: 240
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  # Sign/glyph/deep-link mapping switches are naturally branchy but flat and
  # readable; 10 was too strict for them.
  warning: 15
  error: 20

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 4

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - a   # conventional math-pair params (CompatibilityScorer, geometry)
    - b
    - g   # the Human Design "G" centre

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

force_cast: error
force_try: error
force_unwrapping: error

# ── Custom rules ──
custom_rules:
  no_hex_color_literals:
    name: "No Hex Color Literals"
    message: "Use LuminaColors.* instead of hex literals. Add new colors to Design/Tokens/LuminaColors.swift."
    regex: 'Color\(hex:\s*"#[0-9A-Fa-f]+'
    severity: error
    excluded: ".*/Design/Tokens/LuminaColors\\.swift"

  no_raw_rgb_colors:
    name: "No Raw RGB Colors"
    message: "Use LuminaColors.* instead of Color(red:green:blue:). The widget shipped three hand-copied brand colours this way."
    # Lookbehind so `UIColor(red:` — legitimately used for runtime SceneKit
    # materials, which take no SwiftUI `Color` — isn't caught by it.
    regex: '(?<![A-Za-z])Color\(\s*red:'
    severity: error
    excluded: ".*/Design/Tokens/LuminaColors\\.swift"

  no_hardcoded_font_names:
    name: "No Hardcoded Font Names"
    message: "Use LuminaTypography.* instead of Font.custom() with string literals."
    regex: 'Font\.custom\("(?!.*LuminaTypography)'
    severity: warning
    excluded: ".*/Design/Tokens/LuminaTypography\\.swift"

  no_print_statements:
    name: "No print() Statements"
    message: "Remove print() before committing. Use os.Logger for debug output."
    regex: '\bprint\s*\('
    severity: warning

  lumina_todo_format:
    name: "TODO Format"
    message: "Use // TODO(lumina): description format for trackable TODOs."
    regex: '\/\/\s*TODO(?!\(lumina\))'
    severity: warning

  no_direct_revenuecat_calls_in_views:
    name: "No Direct RevenueCat in Views"
    message: "Access IAP via IAPManager, not Purchases.shared directly in views."
    regex: 'Purchases\.shared\.'
    severity: warning
    included: ".*/Features/.*\\.swift"

  no_magic_spacing_numbers:
    name: "No Magic Spacing Numbers"
    message: "Use LuminaSpacing.* constants. Add to Design/Tokens/LuminaSpacing.swift if needed."
    regex: '(padding|spacing|frame[^)]*\.\s*(width|height))\s*:\s*(?!LuminaSpacing)[0-9]{2,}'
    severity: warning
    excluded: ".*/Design/Tokens/LuminaSpacing\\.swift"

  no_raw_corner_radius:
    name: "No Raw cornerRadius"
    message: "Use .luminaCornerRadius(LuminaRadii.x) — see Design/Tokens/LuminaRadii.swift."
    regex: '\.cornerRadius\('
    severity: warning
    excluded: ".*/Design/Tokens/.*\\.swift"

  no_raw_shadow:
    name: "No Raw shadow"
    message: "Use .luminaShadow(.subtle|.card|.elevated) — see Design/Tokens/LuminaShadows.swift."
    regex: '\.shadow\(color:'
    severity: warning
    excluded: ".*/Design/Tokens/.*\\.swift"

  # `no_modal_on_modal` is intentionally NOT a regex rule — modal nesting
  # detection requires AST awareness that regex can't do without false
  # positives. Tracked as a PR-review checklist item in docs/NAVIGATION.md
  # §2.2 and in TASK.md.
