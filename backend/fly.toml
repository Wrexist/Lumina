# Fly.io deployment for the Lumina ephemeris service.
# Deploy:  fly launch --no-deploy   (first time, to create the app)
#          fly secrets set LUMINA_API_SECRET=$(openssl rand -hex 32)
#          fly deploy
app = "lumina-ephemeris"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
