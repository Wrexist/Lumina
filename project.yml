name: Lumina
options:
  bundleIdPrefix: app.lumina
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  # Intentionally unpinned — CI runs `xcode-version: latest-stable` so the
  # project must regenerate cleanly against whatever Xcode the runner has.
  # See LEARNINGS.md "CI runs on macos-15 with latest-stable Xcode".
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The `inject_env.sh` prebuild script writes secrets/Config.xcconfig from
    # env vars / .env.local — legitimate file I/O the Xcode 26 run-script
    # sandbox denies (it even blocks bash from reading the script itself). CI
    # already injects secrets in a dedicated step before the build, so we turn
    # script sandboxing off rather than fight it. (Re-enable with explicit
    # input/output file declarations if the script is ever removed.)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    # Single source of truth for the marketing + build number, referenced by
    # both the app and widget Info.plists via $(MARKETING_VERSION) /
    # $(CURRENT_PROJECT_VERSION). The TestFlight workflow overrides
    # CURRENT_PROJECT_VERSION on the xcodebuild command line so every upload
    # gets a unique build number — and app + appex stay in lockstep (a
    # mismatch is an App Store Connect rejection).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Warnings-as-errors and upcoming-features are applied per-target below
    # so they only gate our own code, not SPM dependency builds.

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: project.xcconfig
  Release: project.xcconfig

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: 5.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.0.0

targets:
  Lumina:
    type: application
    platform: iOS
    sources:
      - path: Lumina
    resources:
      - path: Lumina/Resources/Fonts
        optional: true
      - path: Lumina/Resources/Glossary.json
        optional: true
      - path: Lumina/Resources/Localizable.xcstrings
        optional: true
      - path: Lumina/Resources/PrivacyInfo.xcprivacy
    info:
      path: Lumina/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lumina
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The brand is a single light "parchment + ink" editorial theme; we
        # ship light-only rather than a half-built dark mode. Revisit when a
        # dark palette exists (see docs/AUDIT-2026-06-03.md R6).
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Lumina uses Face ID to keep your reflections private on this device."
        # NOTE: the Anthropic key is intentionally NOT embedded in the app —
        # LLM interpretation runs server-side via the backend. Shipping the key
        # in Info.plist would make it extractable from the IPA.
        LuminaElevenLabsAPIKey: $(ELEVENLABS_API_KEY)
        LuminaElevenLabsVoiceID: $(ELEVENLABS_VOICE_ID)
        LuminaRevenueCatAPIKeyIOS: $(REVENUECAT_API_KEY_IOS)
        LuminaOneSignalAppID: $(ONESIGNAL_APP_ID)
        LuminaSupabaseURL: $(SUPABASE_URL)
        LuminaSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        LuminaSwissEphServiceURL: $(SWISS_EPH_SERVICE_URL)
        LuminaSwissEphAPISecret: $(SWISS_EPH_API_SECRET)
    # App Group shares the small widget snapshot with the LuminaWidget
    # extension. Generated by XcodeGen from these properties — no committed
    # plist. The container only exists in a properly-signed build (device /
    # TestFlight); simulator/CI builds fall back to standard UserDefaults.
    #
    # Push Notifications / Sign in with Apple / Associated Domains are added
    # here per docs/CAPABILITIES-PLAN.md. CI builds with CODE_SIGNING_ALLOWED=NO
    # (see LEARNINGS.md "WidgetKit ... builds green on simulator CI"), so these
    # entitlements aren't validated against a real provisioning profile there —
    # they still need the matching capability enabled on the `app.lumina.ios`
    # identifier in the Apple Developer portal before a signed TestFlight build
    # will actually work end-to-end.
    entitlements:
      path: Lumina/Lumina.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.lumina.ios
        # Push Notifications capability. `-exportArchive` promotes this to
        # "production" automatically for the signed TestFlight/App Store
        # archive based on the distribution profile — see docs/TESTFLIGHT.md.
        aps-environment: development
        # NOTE: best-effort key for the Push Notifications "Broadcast
        # Capability" sub-toggle (APNs channel/broadcast pushes — one send to
        # every subscriber of a channel, e.g. "New moon tonight", rather than
        # per-device targeting). Could not verify the exact literal
        # entitlement string against live Apple documentation from this
        # environment — confirm this key against Xcode's capability editor
        # (or Apple's current Bundle Resources > Entitlements reference)
        # before the first signed, push-capable build. A channel ID also has
        # to be created in the Push Notifications Console once this is real.
        com.apple.developer.usernotifications.channel: true
        # Sign in with Apple.
        com.apple.developer.applesignin:
          - Default
        # Universal links for chart/friend-share/settings/help deep links.
        # Requires `web/apple-app-site-association` to be hosted at
        # `https://lumina.app/.well-known/apple-app-site-association` — see
        # `web/README.md` (blocked on the lumina.app domain existing).
        com.apple.developer.associated-domains:
          - applinks:lumina.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumina.ios
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Tighten only on our own code; SPM dep builds are unaffected.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Supabase
        product: Supabase
      - package: OneSignal
        product: OneSignalFramework
      - package: Lottie
        product: Lottie
      - target: LuminaWidget
        embed: true
    preBuildScripts:
      - name: Inject env -> secrets/Config.xcconfig
        script: |
          if [ -f "${SRCROOT}/scripts/inject_env.sh" ]; then
            bash "${SRCROOT}/scripts/inject_env.sh" || exit 1
          fi
        basedOnDependencyAnalysis: false

  LuminaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LuminaWidget
      # The snapshot store is the one file shared with the app target (pure
      # Foundation, compiled into both) — the widget reads what the app writes.
      - path: Lumina/Core/Widget/WidgetSharedStore.swift
    info:
      path: LuminaWidget/Info.plist
      properties:
        CFBundleDisplayName: Lumina
        # Must match the host app's version, or embedding fails validation —
        # kept in lockstep via the shared build settings.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LuminaWidget/LuminaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.lumina.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumina.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  LuminaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LuminaTests
    dependencies:
      - target: Lumina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumina.ios.tests
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        # The unit-test bundle has no committed Info.plist; let Xcode generate
        # one (required for code-signing the test bundle).
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumina:
    build:
      targets:
        Lumina: all
        LuminaWidget: all
        LuminaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LuminaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  LuminaTests:
    build:
      targets:
        LuminaTests: [test]
    test:
      config: Debug
      targets:
        - LuminaTests
