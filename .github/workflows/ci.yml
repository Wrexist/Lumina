name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# A push to a claude/** branch and the pull_request opened from that same
# branch fire two separate events for the same commit. github.ref differs
# between them (refs/heads/<branch> vs refs/pull/<n>/merge), so without
# normalizing, both used to run the full pipeline — including the iOS job —
# in parallel. Falling back to the PR's source-branch name keys both events
# to the same group, so cancel-in-progress kills the older, redundant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Cheap up-front check so we don't burn a 45-min macOS runner on a
  # backend-only change, or spin up Node for an iOS-only change. Secret
  # scanning stays unconditional below — it's ~4s and should cover every
  # file type regardless of which area changed.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            metadata:
              - 'metadata/**'
              - 'scripts/aso_lint.py'
              - '.github/workflows/ci.yml'
            ios:
              - 'Lumina/**'
              - 'LuminaTests/**'
              - 'LuminaWidget/**'
              - 'ios/**'
              # The wire contract. Renaming a field in a route or changing a
              # schema breaks the Swift decoders, but the iOS job used to be
              # skipped for any backend-only change — so a contract break
              # merged green. Only the contract surface is listed here, not
              # all of backend/**, so pure lib/service work still skips the
              # 45-minute macOS runner.
              - 'backend/src/routes/**'
              - 'backend/src/types.ts'
              - 'project.yml'
              - 'project.xcconfig'
              - '.swiftlint.yml'
              - '.swiftformat'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend — typecheck · test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Guards the class of bug that shipped a backend which could not boot:
      # `interpret.ts` used a TypeScript parameter property, which vitest
      # (esbuild) and `tsc --noEmit` both accept but which the production
      # entrypoint — `node --experimental-strip-types` — rejects outright.
      # Nothing in CI executed the real entrypoint, so every Fly deploy would
      # have crash-looped. Boot it for real and hit /health.
      - name: Boot production entrypoint and probe /health
        env:
          LUMINA_API_SECRET: ci-smoke-secret-not-a-real-credential
          PORT: "3099"
          HOST: "127.0.0.1"
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3099/health" >/dev/null 2>&1; then
              echo "health OK after ${i}s"
              curl -fsS "http://127.0.0.1:3099/health"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::server exited during boot — production entrypoint is broken"
              wait "$SERVER_PID" || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::/health never became ready within 30s"
          exit 1

  metadata:
    name: App Store metadata — limits · overlap · accuracy
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Seconds, not minutes — and it catches the failures App Store Connect
      # will not: a keyword field one character over 100 is ignored in full,
      # and a term naming an unshipped feature is a 2.3.1 rejection after a
      # week of review queue.
      - name: Validate metadata/app-store.json
        run: python3 scripts/aso_lint.py

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan the working tree (--no-git) so the gate is about what's *in* the
      # source now; the .gitleaks.toml allowlist keeps templates from tripping it.
      - name: Scan for secrets (working tree)
        run: gitleaks detect --no-git --redact --verbose --config .gitleaks.toml --source .

      # A working-tree-only scan cannot see a key that was committed and later
      # deleted — it stays in history forever, still exfiltratable from any
      # clone. This pass covers that. Needs full history, hence fetch-depth 0.
      - name: Fetch full history
        run: git fetch --prune --unshallow || true

      - name: Scan for secrets (full history)
        run: gitleaks detect --redact --verbose --config .gitleaks.toml --source .

  ios:
    name: iOS — generate · build · lint · test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # ANTHROPIC_API_KEY is intentionally absent — the app never embeds it;
      # LLM interpretation is server-side (backend `/interpret`).
      # ELEVENLABS_* were here too, for audio narration that isn't
      # implemented; `inject_env.sh` never wrote them, so they only widened
      # the set of secrets exposed to a build that couldn't use them.
      REVENUECAT_API_KEY_IOS: ${{ secrets.REVENUECAT_API_KEY_IOS }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SWISS_EPH_SERVICE_URL: ${{ secrets.SWISS_EPH_SERVICE_URL }}
      SWISS_EPH_API_SECRET: ${{ secrets.SWISS_EPH_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install xcodegen, swiftlint, swiftformat, xcbeautify
        run: brew install xcodegen swiftlint swiftformat xcbeautify

      - name: Inject env -> secrets/Config.xcconfig
        run: bash scripts/inject_env.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint (strict)
        run: swiftlint lint --strict

      - name: Format check (non-blocking until baseline settles)
        run: swiftformat --lint .
        continue-on-error: true

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Lumina \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -skipPackagePluginValidation \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Lumina \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -skipPackagePluginValidation \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions

      # `ScreenshotTests` renders key screens to PNGs via ImageRenderer; upload
      # them so the UI is reviewable without a Mac. `always()` so they surface
      # even if a later test fails.
      - name: Upload App Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: LuminaTests/__AppStoreShots__/*.png
          if-no-files-found: warn

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: LuminaTests/__Screenshots__/*.png
          if-no-files-found: warn

      # The Claude Code remote runner's egress allowlist blocks the artifact
      # storage host, so also emit each PNG as base64 in the job log — the one
      # channel that environment can read back (via the GitHub API). `openssl`
      # base64 -A is used because macOS `base64` lacks GNU's `-w0`.
      - name: Emit screenshots as base64 (sandbox retrieval)
        if: always()
        run: |
          shopt -s nullglob
          for f in LuminaTests/__Screenshots__/*.png LuminaTests/__AppStoreShots__/*.png; do
            echo "===SHOT_BEGIN $(basename "$f")==="
            openssl base64 -A -in "$f"
            echo ""
            echo "===SHOT_END==="
          done
